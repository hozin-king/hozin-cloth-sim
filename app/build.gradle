apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hozinking.clothsim'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.hozinking.clothsim"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-O2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Keystore debug PERSISTEN: file debug.keystore di root repo dipulihkan
    // workflow dari secret DEBUG_KEYSTORE_BASE64. Config dibuat kondisional
    // agar AGP tidak gagal validateSigningDebug bila file tidak ada.
    signingConfigs {
        if (file("../debug.keystore").exists()) {
            debug {
                storeFile file("../debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("../debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }

    // VM lokal: worker tes Gradle (JVM terpisah) gagal start tanpa
    // preferIPv4Stack (loopback Java di VM ini macet).
    tasks.withType(Test).configureEach {
        jvmArgs '-Djava.net.preferIPv4Stack=true'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}
